# OCI 部署用的 compose。和仓库根目录的官方 docker-compose.yml 相比：
# - 应用镜像用 fork 自己在 GitHub Actions 构建的 ghcr.io/cherrylover/aitoearn-*，三个服务各自钉版本
#   （SERVER_TAG / AI_TAG / WEB_TAG：只改后台时不会重建网页镜像，版本号对不齐）
# - 所有密码从 .env 读，不用默认值
# - 数据库、缓存、存储都不映射宿主机端口；nginx 由服务器上的 Traefik 接入（pub / pub-oss 两个域名），另绑 127.0.0.1 端口给本机检查
# - 不再用官方的自动登录：网页不带任何凭证，登录走后台的 Pocket ID（OIDC）接口；因此也没有 aitoearn-init
# - 数据放在数据盘（DATA_DIR）
#
# 用法见同目录 README.md。项目目录是服务器上的 /opt/stack/aitoearn，相对路径都相对它。

name: aitoearn

# 容器日志默认是不封顶的 json 文件，跑几个月能把小机器的盘吃光，而且没有任何东西会去收它。
# 封到每个容器最多 3×10MB，旧的自动滚掉。应用容器每次部署都重建，改完下次部署就生效；
# 基础服务要等它们下次重建（或者 `docker compose up -d --force-recreate mongodb …`）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:8
    container_name: aitoearn-mongodb
    logging: *default-logging
    restart: unless-stopped
    entrypoint: ["bash", "-c", "openssl rand -base64 756 > /data/mongodb-keyfile && chmod 400 /data/mongodb-keyfile && chown mongodb:mongodb /data/mongodb-keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/mongodb-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes:
      - ${DATA_DIR:?}/mongodb/db:/data/db
      - ${DATA_DIR:?}/mongodb/configdb:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh \"mongodb://admin:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/?authSource=admin\" --quiet --eval \"try { quit(rs.status().ok === 1 ? 0 : 1) } catch(e) { quit(1) }\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongodb-rs-init:
    image: mongo:8
    container_name: aitoearn-mongodb-rs-init
    logging: *default-logging
    depends_on:
      mongodb:
        condition: service_started
    environment:
      MONGO_PASSWORD: ${MONGO_PASSWORD:?}
    entrypoint: ["/bin/sh", "-c", "until mongosh \"mongodb://admin:$${MONGO_PASSWORD}@mongodb:27017/?authSource=admin\" --quiet --eval \"db.adminCommand('ping').ok\" >/dev/null 2>&1; do sleep 2; done; mongosh \"mongodb://admin:$${MONGO_PASSWORD}@mongodb:27017/?authSource=admin\" --eval \"try { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}) } catch(e) { if (e.codeName!=='AlreadyInitialized') throw e }\""]
    restart: "no"

  redis:
    image: redis:8-alpine
    container_name: aitoearn-redis
    logging: *default-logging
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - ${DATA_DIR:?}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: aitoearn-rustfs
    logging: *default-logging
    hostname: rustfs.local
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?}
    volumes:
      - ${DATA_DIR:?}/rustfs:/data
    networks:
      default:
        aliases:
          - rustfs.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rustfs-init:
    image: quay.io/minio/mc:latest  # Docker Hub 上的 minio/mc 已经拉不到
    container_name: aitoearn-rustfs-init
    logging: *default-logging
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?}
    entrypoint: ["/bin/sh", "-c", "mc alias set rustfs http://rustfs.local:9000 \"$${RUSTFS_ACCESS_KEY}\" \"$${RUSTFS_SECRET_KEY}\" && mc mb rustfs/aitoearn --ignore-existing && mc anonymous set download rustfs/aitoearn"]
    restart: "no"

  aitoearn-ai:
    image: ghcr.io/cherrylover/aitoearn-ai:${AI_TAG:?}
    container_name: aitoearn-ai
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config/ai.yaml:/app/config.yaml:ro
      # 运行时配置覆盖层，读写。config.yaml 是 .env 渲染出来的基石，每次部署重新生成；
      # 这一份由网页 /config 保存，deploy.sh 不生成也不碰它，所以重新部署不会被冲掉。
      # deploy.sh 会在 compose 之前 touch 出空文件（600），否则 Docker 会把它建成目录
      - ${DATA_DIR:?}/config/ai.override.yaml:/app/config.override.yaml
      # 项目物料目录，读写。应用容器每次部署都被 rm --stop --force 删掉重建，不落宿主机的东西一律丢失
      - ${DATA_DIR:?}/projects:/data/projects
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  aitoearn-server:
    image: ghcr.io/cherrylover/aitoearn-server:${SERVER_TAG:?}
    container_name: aitoearn-server
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      aitoearn-ai:
        condition: service_healthy
    volumes:
      - ./config/server.yaml:/app/config.yaml:ro
      # 运行时配置覆盖层，读写。和 ai 各一份，互不影响；由 deploy.sh 预先 touch 出来（600）
      - ${DATA_DIR:?}/config/server.override.yaml:/app/config.override.yaml
      # 项目物料目录，读写。和 aitoearn-ai 挂的是同一个宿主机目录，两边看到的是同一份文件
      - ${DATA_DIR:?}/projects:/data/projects
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  aitoearn-web:
    image: ghcr.io/cherrylover/aitoearn-web:${WEB_TAG:?}
    container_name: aitoearn-web
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      aitoearn-server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => { process.exit(r.statusCode < 500 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  nginx:
    image: nginx:1-alpine
    container_name: aitoearn-nginx
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      aitoearn-web:
        condition: service_healthy
      aitoearn-server:
        condition: service_healthy
      aitoearn-ai:
        condition: service_healthy
    ports:
      # 只给本机检查用；对外由 Traefik 接入
      - "127.0.0.1:${WEB_PORT:?}:80"
      - "127.0.0.1:${OSS_PORT:?}:9000"
    volumes:
      - ./repo/deploy/oci/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # 主站：网页 + /api + /oss
      - traefik.http.routers.aitoearn.rule=Host(`${DOMAIN:?}`)
      - traefik.http.routers.aitoearn.entrypoints=websecure
      - traefik.http.routers.aitoearn.tls=true
      - traefik.http.routers.aitoearn.tls.certresolver=letsencrypt
      - traefik.http.routers.aitoearn.service=aitoearn
      - traefik.http.routers.aitoearn-http.rule=Host(`${DOMAIN:?}`)
      - traefik.http.routers.aitoearn-http.entrypoints=web
      - traefik.http.routers.aitoearn-http.middlewares=redirect-to-https@file
      - traefik.http.routers.aitoearn-http.service=aitoearn
      - traefik.http.services.aitoearn.loadbalancer.server.port=80
      # 存储直传：浏览器拿预签名地址直接往这里 PUT
      - traefik.http.routers.aitoearn-oss.rule=Host(`${OSS_DOMAIN:?}`)
      - traefik.http.routers.aitoearn-oss.entrypoints=websecure
      - traefik.http.routers.aitoearn-oss.tls=true
      - traefik.http.routers.aitoearn-oss.tls.certresolver=letsencrypt
      - traefik.http.routers.aitoearn-oss.service=aitoearn-oss
      - traefik.http.routers.aitoearn-oss-http.rule=Host(`${OSS_DOMAIN:?}`)
      - traefik.http.routers.aitoearn-oss-http.entrypoints=web
      - traefik.http.routers.aitoearn-oss-http.middlewares=redirect-to-https@file
      - traefik.http.routers.aitoearn-oss-http.service=aitoearn-oss
      - traefik.http.services.aitoearn-oss.loadbalancer.server.port=9000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/_nhealth"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: aitoearn
  proxy:
    external: true
