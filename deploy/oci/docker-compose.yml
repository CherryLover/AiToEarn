# OCI 部署用的 compose。和仓库根目录的官方 docker-compose.yml 相比：
# - 应用镜像用 fork 自己在 GitHub Actions 构建的 ghcr.io/cherrylover/aitoearn-*，钉死版本（AITOEARN_TAG）
# - 所有密码从 .env 读，不用默认值
# - 数据库、缓存、存储都不映射宿主机端口；只有 nginx 绑在 127.0.0.1 上，由 Cloudflare 隧道接进来
# - 数据放在数据盘（DATA_DIR）
#
# 用法见同目录 README.md。项目目录是服务器上的 /opt/stack/aitoearn，相对路径都相对它。

name: aitoearn

services:
  mongodb:
    image: mongo:8
    container_name: aitoearn-mongodb
    restart: unless-stopped
    entrypoint: ["bash", "-c", "openssl rand -base64 756 > /data/mongodb-keyfile && chmod 400 /data/mongodb-keyfile && chown mongodb:mongodb /data/mongodb-keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/mongodb-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes:
      - ${DATA_DIR:?}/mongodb/db:/data/db
      - ${DATA_DIR:?}/mongodb/configdb:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh \"mongodb://admin:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/?authSource=admin\" --quiet --eval \"try { quit(rs.status().ok === 1 ? 0 : 1) } catch(e) { quit(1) }\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongodb-rs-init:
    image: mongo:8
    container_name: aitoearn-mongodb-rs-init
    depends_on:
      mongodb:
        condition: service_started
    environment:
      MONGO_PASSWORD: ${MONGO_PASSWORD:?}
    entrypoint: ["/bin/sh", "-c", "until mongosh \"mongodb://admin:$${MONGO_PASSWORD}@mongodb:27017/?authSource=admin\" --quiet --eval \"db.adminCommand('ping').ok\" >/dev/null 2>&1; do sleep 2; done; mongosh \"mongodb://admin:$${MONGO_PASSWORD}@mongodb:27017/?authSource=admin\" --eval \"try { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}) } catch(e) { if (e.codeName!=='AlreadyInitialized') throw e }\""]
    restart: "no"

  redis:
    image: redis:8-alpine
    container_name: aitoearn-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - ${DATA_DIR:?}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: aitoearn-rustfs
    hostname: rustfs.local
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?}
    volumes:
      - ${DATA_DIR:?}/rustfs:/data
    networks:
      default:
        aliases:
          - rustfs.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rustfs-init:
    image: minio/mc:latest
    container_name: aitoearn-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?}
    entrypoint: ["/bin/sh", "-c", "mc alias set rustfs http://rustfs.local:9000 \"$${RUSTFS_ACCESS_KEY}\" \"$${RUSTFS_SECRET_KEY}\" && mc mb rustfs/aitoearn --ignore-existing && mc anonymous set download rustfs/aitoearn"]
    restart: "no"

  # 建默认管理员并生成网页自动登录用的 token
  aitoearn-init:
    image: node:24-alpine
    container_name: aitoearn-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./repo/scripts/init.mjs:/app/init.mjs:ro
      - ./repo/scripts/init-package.json:/app/package.json:ro
      - ${DATA_DIR:?}/init:/data/init
    working_dir: /app
    environment:
      MONGO_URI: mongodb://admin:${MONGO_PASSWORD:?}@mongodb:27017
      JWT_SECRET: ${JWT_SECRET:?}
      DB_NAME: aitoearn
      AUTO_LOGIN_TOKEN_PATH: /data/init/token.txt
    entrypoint: /bin/sh -c "npm install --omit=dev 2>/dev/null && node init.mjs"

  aitoearn-ai:
    image: ghcr.io/cherrylover/aitoearn-ai:${AITOEARN_TAG:?}
    container_name: aitoearn-ai
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config/ai.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  aitoearn-server:
    image: ghcr.io/cherrylover/aitoearn-server:${AITOEARN_TAG:?}
    container_name: aitoearn-server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      aitoearn-ai:
        condition: service_healthy
    volumes:
      - ./config/server.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  aitoearn-web:
    image: ghcr.io/cherrylover/aitoearn-web:${AITOEARN_TAG:?}
    container_name: aitoearn-web
    restart: unless-stopped
    depends_on:
      aitoearn-server:
        condition: service_healthy
      aitoearn-init:
        condition: service_completed_successfully
    volumes:
      - ${DATA_DIR:?}/init:/data/init:ro
    command: ["/bin/sh", "-c", "AUTO_LOGIN_TOKEN=$$(cat /data/init/token.txt 2>/dev/null || true); if [ -z \"$$AUTO_LOGIN_TOKEN\" ]; then echo 'AUTO_LOGIN_TOKEN is missing. Check the aitoearn-init container logs.' >&2; exit 1; fi; export AUTO_LOGIN_TOKEN; exec node server.js"]
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => { process.exit(r.statusCode < 500 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  nginx:
    image: nginx:1-alpine
    container_name: aitoearn-nginx
    restart: unless-stopped
    depends_on:
      aitoearn-web:
        condition: service_healthy
      aitoearn-server:
        condition: service_healthy
      aitoearn-ai:
        condition: service_healthy
    ports:
      # 只绑本机，外网进来只能走 Cloudflare 隧道
      - "127.0.0.1:${WEB_PORT:?}:80"
      - "127.0.0.1:${OSS_PORT:?}:9000"
    volumes:
      - ./repo/deploy/oci/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/_nhealth"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: aitoearn
