# 合并进 project/aitoearn-backend/apps/aitoearn-ai/config/config.yaml
# 形如 $${DOMAIN} 的变量来自服务器上的 .env；值为空的项保留官方默认
appDomain: ${DOMAIN}
auth:
  secret: ${JWT_SECRET}
  internalToken: ${INTERNAL_TOKEN}
redis:
  password: ${REDIS_PASSWORD}
mongodb:
  uri: mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin&directConnection=true
redlock:
  redis:
    password: ${REDIS_PASSWORD}
assets:
  accessKeyId: ${RUSTFS_ACCESS_KEY}
  secretAccessKey: ${RUSTFS_SECRET_KEY}
  cdnEndpoint: https://${DOMAIN}/oss
  publicEndpoint: https://${OSS_DOMAIN}
ai:
  # OpenAI 兼容上游（DeepSeek 渠道的模型也走这组）。地址要带 /v1
  openai:
    baseUrl: ${OPENAI_BASE_URL}
    apiKey: ${OPENAI_API_KEY}
  relay:
    apiKey: ${AI_RELAY_API_KEY}
  # 对话模型清单换成上游实际放行的（官方默认那份里的 Gemini / Claude / DeepSeek 我们没有）
  # scenes：web=网页对话，comment=评论回复，draft-generation=草稿生成，plugin=浏览器插件里的 AI 助手
  models:
    chat:
      - name: gpt-5.6
        description: GPT 5.6
        channel: openai
        scenes: [web, comment, draft-generation, plugin]
        inputModalities: [text, image]
        outputModalities: [text]
      - name: gpt-5.5
        description: GPT 5.5
        channel: openai
        scenes: [web, comment, draft-generation, plugin]
        inputModalities: [text, image]
        outputModalities: [text]
      - name: gpt-5.6-luna
        description: GPT 5.6 Luna
        channel: openai
        scenes: [web, comment]
        inputModalities: [text, image]
        outputModalities: [text]

# Bark 推送（阶段 4）。仓库里只有占位，真实地址和 key 只写在服务器的 .env。
# 这四个在 .env 里缺了或者留空都不会拦下部署，只是按留空处理（缺了会被逐个点名）。
# 留空 = 静默关掉推送，服务照常起。要真推，NOTIFY_ENABLED 得是 true，地址和 key 都要填。
# 留空具体渲染成什么、以及线上还欠的那一次实跑，见 deploy/oci/README.md 的「推送（Bark）」一节。
notify:
  enabled: ${NOTIFY_ENABLED}
  barkUrl: ${NOTIFY_BARK_URL}
  barkKey: ${NOTIFY_BARK_KEY}
  group: ${NOTIFY_GROUP}

# Agent（提炼方向、生成草稿走的 Claude Code）。和上面 ai.openai 不是一条线，
# 但上游可以是同一个：OpenAI 协议的中转站把 AGENT_TRANSFORMERS 填 none 即可，
# 地址写到 /v1/chat/completions 这一层；Anthropic 协议的上游留空，地址写到 /v1/messages。
# 这七个在 .env 里缺了或者留空都不会拦下部署，只是按留空处理（缺了会被逐个点名）。
# 全留空 = 保留仓库里的占位上游，提炼方向必然失败——进站横幅和 /setup 会说这件事，
# 也可以直接在网页 /config 里配。详见 deploy/oci/README.md 的「Agent」一节。
agent:
  baseUrl: ${AGENT_BASE_URL}
  apiKey: ${AGENT_API_KEY}
  models: ${AGENT_MODELS}
  defaultModel: ${AGENT_DEFAULT_MODEL}
  backgroundModel: ${AGENT_BACKGROUND_MODEL}
  thinkModel: ${AGENT_THINK_MODEL}
  transformers: ${AGENT_TRANSFORMERS}

# 项目物料根目录（容器内路径），对应 docker-compose.yml 里 $${DATA_DIR}/projects 的挂载点
projects:
  root: /data/projects
